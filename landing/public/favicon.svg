<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="cyanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Badge (High-contrast for dark and light browser tabs) -->
  <rect width="32" height="32" rx="7" fill="#09090b" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
  <!-- Foundation beam (Neev = foundation in Sanskrit) -->
  <path d="M5.5 25.5h21" stroke="url(#cyanBeam)" stroke-width="2.6" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Structural N column truss -->
  <path d="M8.5 25.5V6.5l15 19V6.5" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
